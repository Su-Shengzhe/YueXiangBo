spring.application.name=gateway
server.address=127.0.0.1
server.port=8080
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.instance.hostname=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.cloud.gateway.server.webflux.routes[0].id=parking-dev-probe
spring.cloud.gateway.server.webflux.routes[0].uri=lb://parking-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/dev/**
