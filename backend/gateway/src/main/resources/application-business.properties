server.port=9090
eureka.client.service-url.defaultZone=http://127.0.0.1:9761/eureka/
spring.cloud.gateway.server.webflux.routes[0].id=identity-business
spring.cloud.gateway.server.webflux.routes[0].uri=lb://identity-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**,/api/v1/admin/users/**,/api/v1/admin/communities/*/administrators,/api/v1/admin/audit-logs/identity
spring.cloud.gateway.server.webflux.routes[1].id=trade-business
spring.cloud.gateway.server.webflux.routes[1].uri=lb://trade-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/bills/**,/api/v1/payments/**
spring.cloud.gateway.server.webflux.routes[2].id=parking-business
spring.cloud.gateway.server.webflux.routes[2].uri=lb://parking-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/communities/**,/api/v1/vehicles/**,/api/v1/spaces/**,/api/v1/reservations/**,/api/v1/property/**,/api/v1/demo/**,/api/v1/ai/**,/api/v1/owner/**,/api/v1/windows/**,/api/v1/manage/vehicles,/api/v1/admin/communities,/api/v1/admin/audit-logs/parking
