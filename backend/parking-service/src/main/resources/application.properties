spring.application.name=parking-service
server.address=127.0.0.1
server.port=8082
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.instance.hostname=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.client.registry-fetch-interval-seconds=5
eureka.instance.lease-renewal-interval-in-seconds=5
spring.datasource.url=jdbc:mysql://127.0.0.1:13306/parking_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=parking
spring.datasource.password=${PARKING_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=25672
spring.rabbitmq.username=parking
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.template.retry.enabled=true
spring.data.redis.host=127.0.0.1
spring.data.redis.port=16379
spring.data.redis.password=${REDIS_PASSWORD}
probe.token=${PROBE_TOKEN}
