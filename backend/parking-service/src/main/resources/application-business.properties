server.address=127.0.0.1
server.port=9082
spring.application.name=parking-service
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
eureka.client.service-url.defaultZone=http://127.0.0.1:9761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.client.registry-fetch-interval-seconds=5
spring.datasource.url=jdbc:mysql://127.0.0.1:23306/parking_db?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
spring.datasource.username=parking
spring.datasource.password=${PARKING_DB_PASSWORD}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/business
spring.rabbitmq.host=127.0.0.1
spring.rabbitmq.port=35672
spring.rabbitmq.username=parking
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.data.redis.host=127.0.0.1
spring.data.redis.port=26379
spring.data.redis.password=${REDIS_PASSWORD}
business.service-token=${SERVICE_TOKEN}
business.jwt-public-file=${JWT_PUBLIC_FILE}
business.identity-url=http://127.0.0.1:9081
business.clock-file=${BUSINESS_CLOCK_FILE}
business.demo=${BUSINESS_DEMO:false}
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
spring.task.scheduling.pool.size=3
